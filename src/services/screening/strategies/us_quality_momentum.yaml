name: us_quality_momentum
display_name: 美股趋势质量
description: 面向美股大盘股的趋势质量策略，兼顾流动性、趋势确认和回撤控制
version: "2.1"
category: trend
tags: [us, momentum, quality, trend, large_cap]
analysis_skills: [bull_trend, growth_quality]
style:
  risk_profile: balanced
  holding_period: swing
  execution_style: trend_quality
  market_regime: [risk_on, trend, rotation]
  capital_profile: high_liquidity
  ui_badge: 美股趋势

screening:
  enabled: true
  market_scope: [us]
  hard_filters:
    exclude_st: false
    amount_min: 50000000
    market_cap_min: 10000000000
    price_min: 5
    change_pct_min: -6.0
    change_pct_max: 8.0
    change_60d_min: -2.0
    change_60d_max: 45.0
    require_price_above_ma20: true
    signal_score_min: 55
    macd_status_whitelist: [bullish, neutral]
    volatility_20d_pct_max: 45.0
    max_drawdown_20d_pct_min: -15.0
    atr_20_pct_max: 6.5
  tech_weight: 0.55
  factor_weights:
    trend_confirmation: 0.25
    momentum: 0.20
    risk_control: 0.20
    liquidity: 0.15
    relative_strength: 0.10
    data_quality: 0.10
  scoring_profile:
    momentum_chase_start_pct: 5.0
    momentum_chase_penalty_slope: 12.0
    momentum_60d_overheat_pct: 42.0
    activity_ideal_volume_ratio: 1.6
    activity_ideal_turnover_rate: 1.5
    stability_high_volatility_pct: 40.0
    stability_max_drawdown_floor_pct: -15.0
    stability_high_atr_pct: 6.0
    risk_control_volatility_target_pct: 18.0
    risk_control_volatility_max_pct: 45.0
    risk_control_drawdown_target_pct: -5.0
    risk_control_drawdown_floor_pct: -15.0
    risk_control_atr_target_pct: 2.0
    risk_control_atr_max_pct: 6.5
  risk_profile:
    chase_change_pct: 8.0
    abnormal_volume_ratio: 5.0
    weak_signal_score: 48.0
    low_daily_quality_score: 82.0
  portfolio_profile:
    max_same_bucket: 2
    concentration_penalty: 3.0
  scorecard_profile:
    version: us_evidence_v2
    valuation_status: not_scored
    source: yahoo_adjusted_daily
    intelligence_status: research_only
    intelligence_adjustment_cap: 4.0
    intelligence_risk_floor: -8.0
  event_profile:
    preferred_event_tags: [earnings_beat, guidance_raise, analyst_upgrade, shareholder_return]
    avoided_event_tags: [earnings_miss, guidance_cut, analyst_downgrade]
    preferred_announcement_categories: [earnings, analyst_research]
    avoided_announcement_categories: [regulatory_risk, financial_distress, accounting_risk]
    source_weights:
      earnings: 1.0
      filing: 1.0
      analyst_research: 0.6
      company_news: 0.4
    notes: "资讯只影响下一周期候选排序；资讯缺失不加分，高风险证据达到门槛才排除候选。"
  ranking_hints: |
    优先选择趋势确认、动量质量、回撤控制和流动性均有日线证据的美股大盘股。
    PE/PB、市值和财务质量在当前 Yahoo 日线回放中不可得，因此明确标记为未评分，不使用缺失值默认分参与排名。
    下单前仍需要独立核对财报、事件和盘前盘后流动性；本策略只用于模拟验证。
  max_output: 5
