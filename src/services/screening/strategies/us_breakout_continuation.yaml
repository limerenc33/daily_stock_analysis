name: us_breakout_continuation
display_name: 美股突破延续
description: 捕捉美股个股放量突破后仍保持趋势结构的短中线候选
version: "1.0"
category: trend
tags: [us, breakout, momentum, volume, continuation]
analysis_skills: [volume_breakout, bull_trend]
style:
  risk_profile: aggressive
  holding_period: short_term
  execution_style: breakout
  market_regime: [risk_on, trend, high_volume]
  capital_profile: high_liquidity
  ui_badge: 美股突破

screening:
  enabled: true
  market_scope: [us]
  hard_filters:
    exclude_st: false
    amount_min: 100000000
    market_cap_min: 5000000000
    price_min: 10
    change_pct_min: 1.0
    change_pct_max: 12.0
    require_price_above_ma20: true
    signal_score_min: 60
    macd_status_whitelist: [bullish, neutral]
    breakout_20d_pct_min: -1.0
    range_20d_pct_max: 40.0
    volume_ratio_20d_min: 1.3
    body_pct_min: 0.5
    consolidation_days_20d_min: 8
    atr_20_pct_max: 8.0
  tech_weight: 0.70
  factor_weights:
    momentum: 0.34
    activity: 0.28
    liquidity: 0.22
    stability: 0.10
    size: 0.04
    value: 0.02
  scoring_profile:
    momentum_chase_start_pct: 7.0
    momentum_chase_penalty_slope: 11.0
    activity_ideal_volume_ratio: 2.2
    activity_high_volume_ratio: 8.0
    activity_ideal_turnover_rate: 2.0
    stability_hot_change_pct: 9.0
    stability_high_atr_pct: 7.5
  risk_profile:
    chase_change_pct: 12.0
    abnormal_volume_ratio: 9.0
    weak_signal_score: 50.0
    high_turnover_rate: 8.0
  portfolio_profile:
    max_same_bucket: 1
    concentration_penalty: 5.0
  ranking_hints: |
    优先选择突破前至少 8 个交易日收敛、突破日成交量高于 20 日均值且收盘站稳 MA20 的候选。
    突破策略只代表观察或模拟交易信号，必须设置入场滑点、止损和财报事件过滤，不能直接等同于买入指令。
  max_output: 5
