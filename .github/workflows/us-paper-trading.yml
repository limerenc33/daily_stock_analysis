name: US Paper Trading Daily

on:
  schedule:
    # Redundant off-peak attempts compensate for delayed or dropped GitHub
    # schedules. The script is a no-op after the first successful market date.
    - cron: '17 22 * * 1-5'
    - cron: '17 0 * * 2-6'
    - cron: '17 3 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: us-paper-trading-state
  cancel-in-progress: false

jobs:
  paper-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out default branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore paper-trading state
        run: |
          mkdir -p data/us_paper_trading
          if git fetch origin paper-trading-state; then
            if git show origin/paper-trading-state:data/us_paper_trading/state.json > /tmp/us-paper-state.json; then
              mv /tmp/us-paper-state.json data/us_paper_trading/state.json
            fi
            # Keep immutable per-session snapshots when the state branch is
            # rebuilt from the main checkout on each scheduled run.
            git archive origin/paper-trading-state data/us_paper_trading/archive \
              | tar -x --no-same-owner 2>/dev/null || true
          fi

      - name: Advance portfolios and publish notifications
        id: advance
        env:
          US_GRID_STEP_PCT: ${{ vars.US_GRID_STEP_PCT || '3.0' }}
          US_GRID_TAKE_PROFIT_LEVELS: ${{ vars.US_GRID_TAKE_PROFIT_LEVELS || '2' }}
          US_GRID_STOP_LOSS_LEVELS: ${{ vars.US_GRID_STOP_LOSS_LEVELS || '2' }}
          US_NEWS_INTELLIGENCE_ENABLED: ${{ vars.US_NEWS_INTELLIGENCE_ENABLED || 'true' }}
          US_NEWS_MAX_ITEMS: ${{ vars.US_NEWS_MAX_ITEMS || '8' }}
          US_NEWS_MAX_WORKERS: ${{ vars.US_NEWS_MAX_WORKERS || '4' }}
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_SENDER: ${{ vars.EMAIL_SENDER || secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ vars.EMAIL_RECEIVERS || secrets.EMAIL_RECEIVERS }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN3_SENDKEY: ${{ secrets.SERVERCHAN3_SENDKEY }}
          CUSTOM_WEBHOOK_URLS: ${{ secrets.CUSTOM_WEBHOOK_URLS }}
          CUSTOM_WEBHOOK_BEARER_TOKEN: ${{ secrets.CUSTOM_WEBHOOK_BEARER_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NOTIFICATION_REPORT_CHANNELS: ${{ vars.NOTIFICATION_REPORT_CHANNELS || secrets.NOTIFICATION_REPORT_CHANNELS }}
          NOTIFICATION_TIMEZONE: Asia/Shanghai
        run: |
          before_hash="$(sha256sum data/us_paper_trading/state.json 2>/dev/null | cut -d' ' -f1)"
          python scripts/run_us_paper_trading.py --notify --skip-unchanged-session
          after_hash="$(sha256sum data/us_paper_trading/state.json 2>/dev/null | cut -d' ' -f1)"
          if [ -n "$after_hash" ] && [ "$after_hash" != "$before_hash" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add report to workflow summary
        if: always()
        run: |
          if [ -f data/us_paper_trading/latest.md ]; then
            cat data/us_paper_trading/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload auditable state and report
        if: steps.advance.outputs.changed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: us-paper-trading-${{ github.run_id }}
          path: |
            data/us_paper_trading/state.json
            data/us_paper_trading/latest.md
            data/us_paper_trading/archive
          retention-days: 90

      - name: Update the daily GitHub issue
        if: steps.advance.outputs.changed == 'true'
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const title = '美股模拟交易日报';
            const report = fs.readFileSync('data/us_paper_trading/latest.md', 'utf8').slice(0, 60000);
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100
            });
            const existing = issues.find(item => !item.pull_request && item.title === title);
            if (!existing) {
              await github.rest.issues.create({ owner, repo, title, body: report });
            } else {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body: report });
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `每日更新：${new Date().toISOString()}\n\n${report}`
              });
            }

      - name: Persist state on a dedicated branch
        if: steps.advance.outputs.changed == 'true'
        run: |
          cp data/us_paper_trading/state.json /tmp/us-paper-state.json
          cp data/us_paper_trading/latest.md /tmp/us-paper-latest.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git fetch origin paper-trading-state; then
            git switch -C paper-trading-state origin/paper-trading-state
          else
            git switch --orphan paper-trading-state
            git rm -rf . || true
          fi
          mkdir -p data/us_paper_trading
          cp /tmp/us-paper-state.json data/us_paper_trading/state.json
          cp /tmp/us-paper-latest.md data/us_paper_trading/latest.md
          git add -f data/us_paper_trading/state.json data/us_paper_trading/latest.md data/us_paper_trading/archive
          git commit -m "chore: update US paper trading state ${GITHUB_RUN_ID}" || exit 0
          git push origin HEAD:paper-trading-state
